<span id="modal-title" hx-swap-oob="innerHTML">Create New Workspace</span>
<span id="modal-description" hx-swap-oob="innerHTML">Set up an isolated instance for your engineering workflows.</span>
<form autocomplete="off" hx-post="/workspaces/new" hx-target="#modal-form-container" class="space-y-6">
    <div class="form-control w-full">
        <label for="name" class="label pb-2 pl-0">
            <span class="label-text font-semibold text-base-content/80 text-sm">Workspace Name</span>
        </label>

        <div class="relative flex items-center">
            <input id="name" name="name" type="text" autocomplete="off" placeholder="engineering"
                class='input input-bordered w-full bg-base-200/30 focus:bg-base-100 transition-all duration-200 pr-10 focus:input-primary {{ if index .Errors "name" }}input-error focus:input-error bg-error/5{{ end }}' />

            {{ if index .Errors "name" }}
            <span class="absolute right-3 text-error">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                    class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
            </span>
            {{ end }}
        </div>

        <label for="name" class="label pt-2 pb-0 pl-0 min-h-6">
            {{ if index .Errors "name" }}
            <span class="label-text-alt text-error font-medium flex items-center gap-1">
                {{ index .Errors "name" }}
            </span>
            {{ end }}
        </label>
    </div>
    <div class="form-control w-full">
        <label for="name" class="label pb-2 pl-0">
            <span class="label-text font-semibold text-base-content/80 text-sm">Workspace Key</span>
        </label>

        <div class="relative flex items-center">
            <input id="key" name="key" type="text" autocomplete="off" placeholder="engineering-team"
                class='input input-bordered w-full bg-base-200/30 focus:bg-base-100 transition-all duration-200 pr-10 focus:input-primary {{ if index .Errors "name" }}input-error focus:input-error bg-error/5{{ end }}' />

            {{ if index .Errors "key" }}
            <span class="absolute right-3 text-error text-sm">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                    class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
            </span>
            {{ end }}
        </div>

        <label for="name" class="label pt-2 pb-0 pl-0 min-h-6">
            {{ if index .Errors "key" }}
            <span class="label-text-alt text-error font-medium flex items-center gap-1">
                {{ index .Errors "key" }}
            </span>
            {{ else }}
            <span class="label-text-alt text-base-content/40">Must be a unique name within your
                organization.</span>
            {{ end }}
        </label>
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-base-200">
        <button type="button" class="btn btn-ghost btn-sm sm:btn-md" onclick="document.getElementById('modal').close()">
            Cancel
        </button>
        <button type="submit" class="btn btn-primary btn-sm sm:btn-md shadow-sm hover:shadow font-semibold px-6">
            Create Workspace
        </button>
    </div>
</form>
